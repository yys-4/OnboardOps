global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
    metrics_path: /metrics

  - job_name: backend
    static_configs:
      - targets: ["backend:4000"]
    metrics_path: /metrics

  - job_name: incident-manager
    static_configs:
      - targets: ["incident-manager:5000"]
    metrics_path: /metrics
