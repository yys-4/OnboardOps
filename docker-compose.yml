services:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: onboardops
      POSTGRES_USER: onboardops
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - .data/postgres:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onboardops"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  # ── OpenTelemetry Collector ───────────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./infra/docker/otel/config.yaml:/etc/otel/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8889:8889"   # Prometheus metrics
    depends_on:
      - jaeger

  # ── Jaeger (tracing UI) ───────────────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"   # UI
      - "14250:14250"   # gRPC

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.49.0
    volumes:
      - ./infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3001:3000"
    volumes:
      - .data/grafana:/var/lib/grafana
      - ./infra/docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  # ── Backend Service ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./services/backend
      dockerfile: ../../infra/docker/backend/Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://onboardops:password@postgres:5432/onboardops
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-change-in-prod-min-32-chars
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_SERVICE_NAME: onboardops-backend
      ENABLE_ERROR_ENDPOINTS: "true"
      LOG_LEVEL: debug
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Incident Manager ─────────────────────────────────────────────────────
  incident-manager:
    build:
      context: ./services/incident-manager
      dockerfile: ../../infra/docker/incident-manager/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://onboardops:password@postgres:5432/onboardops
      REDIS_URL: redis://redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      FIREWORKS_API_KEY: ${FIREWORKS_API_KEY:-}
      BACKEND_URL: http://backend:4000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      LOG_LEVEL: debug
      PORT: 5000
    ports:
      - "${INCIDENT_MANAGER_PORT:-5001}:5000"
    depends_on:
      postgres:
        condition: service_healthy
      backend:
        condition: service_healthy

  # ── Dashboard ─────────────────────────────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
      dockerfile: ../infra/docker/dashboard/Dockerfile
      args:
        VITE_INCIDENT_URL: http://localhost:${INCIDENT_MANAGER_PORT:-5001}
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_INCIDENT_URL: http://localhost:${INCIDENT_MANAGER_PORT:-5001}
    ports:
      - "3000:80"
    depends_on:
      - backend
      - incident-manager

networks:
  default:
    name: onboardops-net

volumes:
  postgres_data:
  grafana_data:
